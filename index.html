<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music BR</title>
  <meta name="description" content="Acervo Music BR: artistas, discos e músicas da planilha MUSICBR, com capas e player do Drive.">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <script>try { var t = localStorage.getItem("mbr-tema"); if (t) document.documentElement.dataset.tema = t; } catch (e) {}</script>
  <link rel="icon" href="assets/icone.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=1.2">
</head>
<body>
  <header class="topo">
    <div class="topo-in">
      <a class="marca" href="#/" aria-label="Music BR — início">
        <img src="assets/icone.svg" alt="" width="40" height="40">
        <span><b>Music</b> BR</span>
      </a>
      <nav class="menu" aria-label="Seções">
        <a href="#/" data-rota="">Início</a>
        <a href="#/discos" data-rota="discos">Discos</a>
        <a href="#/artistas" data-rota="artistas">Artistas</a>
        <a href="#/numeros" data-rota="numeros">Números</a>
      </nav>
      <button type="button" class="drive-btn" id="drive-btn" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.7 3h8.6l5.2 9-4.3 7.5H6.8L2.5 12z"/><path d="M7.7 3 12 10.5"/><path d="m21.5 12h-8.6"/><path d="m6.8 19.5 4.3-7.5"/></svg>
        <span id="drive-txt">Conectar Drive</span>
      </button>
    </div>
  </header>

  <div class="faixa-busca">
    <form class="busca" id="busca" role="search" autocomplete="off">
      <div class="campo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
        <input id="q" type="search" placeholder="Artista, disco ou ano (1977, anos 70)" aria-label="Buscar no Music BR">
        <button class="btn" type="submit">Buscar</button>
      </div>
    </form>
  </div>

  <main id="app"><div class="carregando">Carregando o acervo…</div></main>

  <footer>
    <div class="in">
      <span>Music BR · dados da <a id="link-planilha" target="_blank" rel="noopener">planilha MUSICBR</a>; capas e músicas do Google Drive.</span>
      <span><span id="atualizado"></span> · <b class="versao">v1.2</b>
        <button type="button" class="tema" id="tema" title="Mudar tema" aria-label="Mudar entre claro e escuro">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.14A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button></span>
    </div>
  </footer>

  <div class="player" id="player" hidden>
    <div class="player-in">
      <div class="pl-capa" id="pl-capa"></div>
      <div class="pl-info"><b id="pl-titulo"></b><span id="pl-sub"></span></div>
      <div class="pl-ctrl">
        <button type="button" id="pl-ant" aria-label="Faixa anterior"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button type="button" id="pl-play" class="pl-play" aria-label="Tocar/pausar"><svg class="i-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg><svg class="i-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
        <button type="button" id="pl-prox" aria-label="Próxima faixa"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      </div>
      <div class="pl-barra">
        <span id="pl-t">0:00</span>
        <input type="range" id="pl-pos" min="0" max="1000" value="0" aria-label="Posição na faixa">
        <span id="pl-d">0:00</span>
      </div>
      <button type="button" id="pl-fechar" class="pl-fechar" aria-label="Fechar player">×</button>
    </div>
    <audio id="audio" preload="auto"></audio>
  </div>

  <div class="dica-flutuante" id="dica" role="tooltip"></div>
  <script src="assets/config.js?v=1.2"></script>
  <script src="assets/drive.js?v=1.2"></script>
  <script src="assets/app.js?v=1.2"></script>
</body>
</html>
