name: Atualizar catálogo

# Lê a aba MUSICBR da planilha e regenera data/musicbr.json.
# Só roda quando alguém pede: o ícone de atualizar no topo do site
# ou o botão "Run workflow" na aba Actions. Não há agendamento.
# Se algo mudou, faz commit — e o GitHub Pages publica sozinho.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: escreve-no-repo
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ler planilha
        run: python3 scripts/atualizar.py
      - name: Commit se mudou
        run: |
          if git diff --quiet -- data; then echo "Nada novo na planilha."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -q -m "Atualiza catálogo a partir da planilha ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          git pull --rebase -q origin main && git push
