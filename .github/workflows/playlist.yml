name: Editar playlist

# Chamado pelo site (apagar playlist ou trocar a capa), com o mesmo token do "Atualizar catálogo".
on:
  workflow_dispatch:
    inputs:
      acao:
        description: "apagar ou capa"
        required: true
        type: choice
        options: [apagar, capa]
      id:
        description: "id da playlist"
        required: true
      capa:
        description: 'JSON da capa, ex.: {"tipo":"disco","disco":"15b42586"}'
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: escreve-no-repo
  cancel-in-progress: false

jobs:
  editar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Editar
        env:
          ACAO: ${{ inputs.acao }}
          ID: ${{ inputs.id }}
          CAPA: ${{ inputs.capa }}
        run: python3 scripts/editar_playlist.py --acao "$ACAO" --id "$ID" --capa "$CAPA"
      - name: Commit se mudou
        env:
          ACAO: ${{ inputs.acao }}
          ID: ${{ inputs.id }}
        run: |
          if git diff --quiet -- data/playlists.json; then echo "Nada mudou."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/playlists.json
          git commit -q -m "Playlist: $ACAO $ID"
          git pull --rebase -q origin main && git push
